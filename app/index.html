<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#5b3a86" />
  <title>Tapaia · A town square in Veridia</title>
  <meta name="description" content="A town square in Veridia, the world of Snowmoon. Chat, role-play and gather, powered by Zipcoin. Open source; not affiliated with Vitalik Buterin, zipcoin.cash or Stockereum." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tapaia" />
  <meta property="og:title" content="Tapaia · A town square in Veridia" />
  <meta property="og:description" content="Chat, role-play and gather, powered by Zipcoin. Open source, set in the world of Snowmoon." />
  <meta property="og:image" content="https://tapaia.onrender.com/brand/logo-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@TapaiaSquare" />
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/logo-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png" />
  <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
  <link rel="apple-touch-icon" href="/brand/logo-app-icon-512.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    // apply the saved theme before first paint (defaults to the system setting)
    (function () {
      try {
        var p = localStorage.getItem('tapaia-theme') || 'system';
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
